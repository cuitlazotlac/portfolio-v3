<svg viewBox="0 0 110 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HVE — Hayssem Vazquez-Elsayed">
  <!-- Architectural Monogram Cipher Mark -->
  <g class="hve-mark">
    <!-- Left & Right Structural Columns -->
    <line x1="5" y1="5" x2="5" y2="27" stroke="#f2f2ef" stroke-width="2.2" stroke-linecap="round" />
    <line x1="23" y1="5" x2="23" y2="27" stroke="#f2f2ef" stroke-width="2.2" stroke-linecap="round" />
    <!-- Horizontal Cross Tie -->
    <line x1="5" y1="16" x2="23" y2="16" stroke="#f2f2ef" stroke-width="2.2" stroke-linecap="round" />
    <!-- Architectural Chevron V linking the columns -->
    <polyline points="5,7 14,23 23,7" stroke="#ffb300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Precision Central Telemetry Node -->
    <circle cx="14" cy="16" r="2.2" fill="#ffb300" />
  </g>

  <!-- Precision Lettering: H V E -->
  <g class="hve-text" stroke="#f2f2ef" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- H -->
    <line x1="36" y1="7" x2="36" y2="25" />
    <line x1="36" y1="16" x2="47" y2="16" />
    <line x1="47" y1="7" x2="47" y2="25" />

    <!-- V -->
    <polyline points="54,7 62,25 70,7" />

    <!-- E -->
    <line x1="77" y1="7" x2="77" y2="25" />
    <line x1="77" y1="7" x2="88" y2="7" />
    <line x1="77" y1="16" x2="85" y2="16" />
    <line x1="77" y1="25" x2="88" y2="25" />
  </g>

  <!-- Amber Telemetry Accent Dot -->
  <rect x="94" y="21" width="3.5" height="3.5" rx="0.75" fill="#ffb300" />
</svg>
